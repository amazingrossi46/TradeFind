kind = "mobile"
previewPath = "/"
title = "TradeFind"
description = "A UK trades marketplace mobile app connecting tradespeople with customers and businesses who need work completed. Includes role-based onboarding, profiles, job posting and browsing, applications, messaging, reviews, and a simple admin area."
version = "1.0.0"
id = "artifacts/tradefind"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25811

[services.development]
run = "pnpm --filter @workspace/tradefind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradefind", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tradefind", "run", "serve" ]

[services.env]
PORT = "25811"
BASE_PATH = "/"
